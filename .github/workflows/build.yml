name: Build JDP Presenter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS .app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,macos,build]"

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --name "JDP Presenter" --icon assets/icon.icns --add-data "app/server/templates:templates" --add-data "app/resources/help:help" --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." --hidden-import=PySide6.QtMultimedia --hidden-import=PySide6.QtMultimediaWidgets --hidden-import=PySide6.QtNetwork --hidden-import=PySide6.QtWebSockets --hidden-import=sounddevice --hidden-import=numpy --hidden-import=qrcode --hidden-import=PIL --hidden-import=flask --hidden-import=flask_socketio --hidden-import=socketio app/main.py

      - name: Create DMG
        run: |
          hdiutil create -volname "JDP Presenter" -srcfolder "dist/JDP Presenter.app" -ov -format UDZO "dist/JDP-Presenter-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdp-presenter-macos
          path: |
            dist/JDP Presenter.app
            dist/JDP-Presenter-macos.dmg

      - name: Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JDP-Presenter-macos.dmg
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed --name "JDP Presenter" --icon assets/icon.ico --add-data "app/server/templates;templates" --add-data "app/resources/help;help" --add-data "LICENSE;." --add-data "THIRD_PARTY_NOTICES.md;." --hidden-import=PySide6.QtMultimedia --hidden-import=PySide6.QtMultimediaWidgets --hidden-import=PySide6.QtNetwork --hidden-import=PySide6.QtWebSockets --hidden-import=sounddevice --hidden-import=numpy --hidden-import=qrcode --hidden-import=PIL --hidden-import=flask --hidden-import=flask_socketio --hidden-import=socketio app/main.py

      - name: Create ZIP
        run: |
          Compress-Archive -Path "dist/JDP Presenter" -DestinationPath "dist/JDP-Presenter-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdp-presenter-windows
          path: |
            dist/JDP Presenter
            dist/JDP-Presenter-windows.zip

      - name: Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JDP-Presenter-windows.zip
          draft: false
          prerelease: false

  build-linux:
    name: Build Linux archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libglib2.0-0 libgl1 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed --name "JDP Presenter" --icon assets/icon.png --add-data "app/server/templates:templates" --add-data "app/resources/help:help" --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." --hidden-import=PySide6.QtMultimedia --hidden-import=PySide6.QtMultimediaWidgets --hidden-import=PySide6.QtNetwork --hidden-import=PySide6.QtWebSockets --hidden-import=sounddevice --hidden-import=numpy --hidden-import=qrcode --hidden-import=PIL --hidden-import=flask --hidden-import=flask_socketio --hidden-import=socketio app/main.py

      - name: Create Linux archive
        run: |
          tar -C dist -czf dist/JDP-Presenter-linux.tar.gz "JDP Presenter"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdp-presenter-linux
          path: |
            dist/JDP-Presenter-linux.tar.gz

      - name: Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JDP-Presenter-linux.tar.gz
          draft: false
          prerelease: false