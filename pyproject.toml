[project]
name = "jdp-presenter"
version = "0.1.4"
description = "Church presentation app (Python/PySide6 rewrite) for managing services, projecting content, and recording sermons"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Flask>=3.0",
    "Flask-SocketIO>=5.3",
    "python-socketio>=5.11",
    "qrcode>=7.4",
    "Pillow>=10.0",
    "requests>=2.31",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.4",
]
macos = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-MediaPlayer>=10.0; sys_platform == 'darwin'",
]
build = [
    "pyinstaller>=6.0",
    "py2app>=0.28; sys_platform == 'darwin'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# py2app configuration (macOS .app bundle)
[tool.py2app]
argv_emulation = false
packages = ["app", "PySide6"]
includes = ["PySide6.QtMultimedia", "PySide6.QtMultimediaWidgets", "PySide6.QtNetwork"]
resources = [
    "data/starter-library.jdplibrary",
    "data/services",
    "data/media",
    "data/import",
]
iconfile = "assets/icon.icns"
plist = """
<dict>
    <key>CFBundleName</key>
    <string>JDP Presenter</string>
    <key>CFBundleDisplayName</key>
    <string>JDP Presenter</string>
    <key>CFBundleIdentifier</key>
    <string>com.jdp.presenter</string>
    <key>CFBundleVersion</key>
    <string>0.1.0</string>
    <key>CFBundleShortVersionString</key>
    <string>0.1.0</string>
    <key>NSHumanReadableCopyright</key>
    <string>Copyright © 2024 JDP Presenter</string>
    <key>NSHighResolutionCapable</key>
    <true/>
    <key>LSApplicationCategoryType</key>
    <string>public.app-category.productivity</string>
    <key>NSMicrophoneUsageDescription</key>
    <string>JDP Presenter needs microphone access for sermon recording.</string>
    <key>NSCameraUsageDescription</key>
    <string>JDP Presenter needs camera access for video capture (future feature).</string>
</dict>
"""

# PyInstaller configuration (cross-platform)
[tool.pyinstaller]
name = "JDP Presenter"
onefile = true
windowed = true
icon = "assets/icon.ico"
add-data = [
    "app/server/templates:templates",
    "app/resources/help:help",
    "data/starter-library.jdplibrary:data",
]
hidden-imports = [
    "PySide6.QtMultimedia",
    "PySide6.QtMultimediaWidgets",
    "PySide6.QtNetwork",
    "PySide6.QtWebSockets",
    "sounddevice",
    "numpy",
    "qrcode",
    "PIL",
    "flask",
    "flask_socketio",
    "socketio",
]
